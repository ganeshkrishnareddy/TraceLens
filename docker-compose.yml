# TraceLens - one command to run the full stack locally.
#   docker compose up --build
# Website: http://localhost:5173   API: http://localhost:8000
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tracelens-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tracelens-web
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
