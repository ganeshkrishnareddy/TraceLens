<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Arial, Helvetica, sans-serif; background: #0f1f3d; color: #f8fafc; }
  .wrap { width: 100%; height: 100%; padding: 96px 110px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { color: #5eead4; font-size: 22px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 28px; }
  h1 { font-size: 66px; line-height: 1.08; margin: 0 0 26px; font-weight: 700; letter-spacing: -2px; max-width: 1000px; }
  .rule { width: 120px; height: 6px; background: #0e7c7b; border-radius: 3px; margin: 0 0 30px; }
  p { font-size: 27px; line-height: 1.5; color: #cbd5e1; margin: 0; max-width: 940px; }
  .foot { position: absolute; left: 110px; bottom: 62px; color: #94a3b8; font-size: 19px; letter-spacing: 1px; }
  .mark { position: absolute; right: 112px; top: 80px; width: 74px; height: 74px; border: 4px solid #5eead4; border-radius: 50%; }
  .mark::after { content: ''; position: absolute; left: 27px; top: 27px; width: 16px; height: 16px; background: #5eead4; border-radius: 50%; }
</style>
</head>
<body>
  <div class="mark"></div>
  <div class="wrap">
    <div class="eyebrow">AEGYTHON 2026 · Challenge 02</div>
    <h1>TraceLens — Explainable AI for Anomaly Detection</h1>
    <div class="rule"></div>
    <p>Detect anomalies, explain the evidence, and investigate incidents with a reproducible local pipeline.</p>
  </div>
  <div class="foot">ProgVision · FastAPI · React · scikit-learn</div>
</body>
</html>
