<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Arial, Helvetica, sans-serif; background: #0f1f3d; color: #f8fafc; }
  .wrap { width: 100%; height: 100%; padding: 86px 110px; }
  .eyebrow { color: #5eead4; font-size: 21px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 22px; }
  h1 { font-size: 58px; line-height: 1.1; margin: 0 0 34px; font-weight: 700; letter-spacing: -1.5px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { background: rgba(255,255,255,0.07); border: 1px solid rgba(94,234,212,0.35); border-radius: 14px; padding: 28px 26px; min-height: 176px; }
  .kpi { font-size: 46px; font-weight: 700; color: #5eead4; margin-bottom: 12px; }
  .label { font-size: 20px; line-height: 1.4; color: #e2e8f0; }
  .small { font-size: 18px; color: #94a3b8; margin-top: 26px; }
  .rule { width: 120px; height: 6px; background: #0e7c7b; border-radius: 3px; margin-bottom: 28px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Summary</div>
    <h1>Explainable detection, end to end.</h1>
    <div class="rule"></div>
    <div class="grid">
      <div class="card"><div class="kpi">0.901</div><div class="label">Best AUC from MAD / IQR on the held-out test split</div></div>
      <div class="card"><div class="kpi">40 / 40</div><div class="label">Automated tests passing across the project</div></div>
      <div class="card"><div class="kpi">Fixed seeds</div><div class="label">Reproducible data, training, detection, and reports</div></div>
    </div>
    <div class="small">TraceLens · FastAPI + React + scikit-learn · Runs entirely on your machine</div>
  </div>
</body>
</html>
